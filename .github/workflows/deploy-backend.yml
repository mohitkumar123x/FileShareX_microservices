name: Deploy Backend to EC2

on:
  push:
    branches: [ "main" ]
    paths:
      - "config-repo/**"
      - "config-server/**"
      - "eureka-server/**"
      - "gateway/**"
      - "user-service/**"
      - "file-service/**"
      - "payment-service/**"
      - "notification-service/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            # 1. Ensure project directory exists
            if [ ! -d "$HOME/fileshare_x_microservice" ]; then
              git clone https://github.com/${{ github.repository }}.git $HOME/fileshare_x_microservice
            fi
            cd $HOME/fileshare_x_microservice

            # 2. Pull latest code from main
            git reset --hard
            git pull origin main

            # 3. Ensure Java 21 JDK is installed on EC2 for building
            if ! command -v javac &> /dev/null; then
              echo "Installing OpenJDK 21 on EC2..."
              sudo apt update && sudo apt install -y openjdk-21-jdk-headless
            fi

            # 4. Fix line endings and build all service jars once on host (fast & reliable)
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            ./gradlew bootJar --no-daemon

            # 5. Build and launch containers using pre-built jars
            docker compose up -d --build --remove-orphans

            # 6. Clean up dangling images to save free tier disk space
            docker image prune -f
