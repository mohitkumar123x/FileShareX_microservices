name: Deploy Backend to EC2

on:
  push:
    branches: [ "main" ]
    paths:
      - "config-repo/**"
      - "config-server/**"
      - "eureka-server/**"
      - "gateway/**"
      - "user-service/**"
      - "file-service/**"
      - "payment-service/**"
      - "notification-service/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            # 1. Ensure project directory exists
            if [ ! -d "$HOME/fileshare_x_microservice" ]; then
              git clone https://github.com/${{ github.repository }}.git $HOME/fileshare_x_microservice
            fi
            cd $HOME/fileshare_x_microservice

            # 2. Pull latest code from main
            git reset --hard
            git pull origin main

            # 3. If ENV_FILE secret was passed, update .env; otherwise keep existing server .env
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              echo "${{ secrets.ENV_FILE }}" > .env
            fi

            # 4. Rebuild and launch containers
            docker compose up -d --build --remove-orphans

            # 5. Clean up dangling images to save free tier disk space
            docker image prune -f
