spring:
  application:
    name: gateway

server:
  port: 8080

# CORS
gateway:
  globalcors:
    cors-configurations:
      '[/**]':
        allowedOrigins: "*"
        allowedMethods: "*"
        allowedHeaders: "*"
        allowCredentials: true

# Routes
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1.0/users/**,/api/v1.0/webhooks/**
          filters:
            - StripPrefix=2

        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/v1.0/files/**
          filters:
            - StripPrefix=2

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1.0/payments/**,/api/v1.0/transactions/**
          filters:
            - StripPrefix=2
