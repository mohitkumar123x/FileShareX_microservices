spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 60s
        pool:
          type: elastic
          max-idle-time: 15s
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1.0/users/**,/api/v1.0/webhooks/**

        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/v1.0/files/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1.0/payments/**,/api/v1.0/transactions/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1.0/notifications/**

server:
  port: 8080
