spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/filesharex_users}
    username: ${SPRING_DATASOURCE_USERNAME:filesharex}
    password: ${SPRING_DATASOURCE_PASSWORD:filesharex}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8081
  servlet:
    context-path: /api/v1.0

spring.autoconfigure.exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
